[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-approx"
version = "0.1.0"
description = "Phenomenological approximations of variable-star light curves"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maksym Yu. Pyatnytskyy", email = "mpyat2@gmail.com" },
    { name = "Olga Vozyakova", email = "olgavoz@gmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
cli = [
    "pandas",
    "matplotlib",
    "colorama",
]

[tool.setuptools]
packages = ["ila_code"]
